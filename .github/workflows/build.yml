# Builds the Windows installer and the Linux AppImage from a clean checkout.
#
# The heavy assets are not in the repository, so each runner exports the Maia-3
# model, fetches the Lichess dump and rebuilds the puzzle database from scratch.
# That takes a few minutes but keeps the repo small and the build reproducible.
#
# AppImage cannot be produced on a Windows host, which is the whole reason this
# workflow exists: the Linux job runs on a Linux runner.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # npm 11 gates install scripts, which is what fetches Electron's binary.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Exporting needs PyTorch, which is a large download, so the wheels are
      # cached between runs. The exported model itself is only a few megabytes.
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: maia-export-${{ runner.os }}-${{ hashFiles('scripts/maia/requirements.txt') }}

      - name: Export Maia-3 model
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The CPU wheel is a fraction of the size of the default CUDA build.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/maia/requirements.txt
          npm run maia:export

      # Runs after the export because the inference tests check the TypeScript
      # engine against the real model.
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Fetch piece sets
        run: npm run assets:pieces

      - name: Build puzzle database
        shell: bash
        run: |
          curl -L -o assets/raw/lichess_db_puzzle.csv.zst \
            https://database.lichess.org/lichess_db_puzzle.csv.zst
          npm run puzzles:build

      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: chess-trainer-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          # The installers carry a 3GB database; skip re-compressing them.
          compression-level: 0
