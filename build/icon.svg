<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Application icon.

    The knight is the white knight from the Chessnut piece set, which already
    ships with the app, by Alexis Luengas, licensed Apache 2.0. It is used
    unmodified apart from scaling and placement. Attribution is recorded in
    README.md and NOTICE.

    Chessnut was chosen over the other bundled sets on two grounds: it holds the
    clearest silhouette when shrunk to taskbar size, and its licence adds no
    copyleft obligation to the packaged app.

    Regenerate the PNG with: npm run assets:icon
  -->
  <defs>
    <!-- Slate ground, lit from the top-left so the tile has some depth. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3b4453"/>
      <stop offset="0.55" stop-color="#252b36"/>
      <stop offset="1" stop-color="#181d25"/>
    </linearGradient>

    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Faint accent ring, echoing the app's green, to lift the flat ground. -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#6fcf97" stroke-opacity="0.14" stroke-width="1.5"/>

  <g filter="url(#drop)" transform="translate(13 13) scale(0.092500)">
    <g stroke="#000" stroke-miterlimit="10"><path fill="#fff" stroke-linecap="round" stroke-width="29.2" d="M645.3 692.2V280.6C588 238.8 503 194.8 448.7 182.5c-42.6-9.7-101.3-2.1-148.6 13.2a96 96 0 0 0-81.5-60.4c6.3 29.6 5.9 74.3 24.3 97.7-7 16.2-32.1 69.4-48.7 119.3v39.4a5617.5 5617.5 0 0 0-43.4 212.8L271.7 656l22.4-58.1c15.2-22.7 45.7-60.9 65-78.2 24.5-10.3 55.9-29.4 66.7-59.2 14-38.4 6.3-84.3-10.5-119.9 31 30.2 50 77 50 127.8 0 68.1-38.1 145.9-104.7 223.7h284.7z"/><path stroke-width="9.2" d="M179.8 574.8c19.4-10.9 33.9 3.8 22.4 25.2z"/><path d="M231.5 357.9c-7 9.5-.6 29.3 6 34.5a50 50 0 0 0 18.6-8l21.5-24.9-4.5-3.7a264 264 0 0 0-41.6 2.1z"/><path fill="#fff" stroke-linecap="square" stroke-width="23.8" d="M320 186c-12.4-17.9-9.8-49.7 7-75.1a68.2 68.2 0 0 1 35.2 70.6"/></g>
  </g>
</svg>
